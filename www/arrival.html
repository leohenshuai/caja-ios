    :root{--ink:#f1f5f9;--muted:#94a3b8;--paper:#0f172a;--card:#1e293b;--line:#334155;--green:#10b981;--lime:rgba(16,185,129,.14);--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--cyan:#06b6d4;--purple:#8b5cf6;--shadow:0 12px 32px rgba(0,0,0,.28)}

    /* ===== iPhone 13 Pro 优化（390×844，刘海屏，iOS Safari）===== */
    @media(max-width:430px){
      /* 刘海/底部横条安全区 */
      .shell{padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 32px) calc(env(safe-area-inset-left,0px) + 12px)}
      /* iOS 输入框小于16px会自动放大页面，统一抬到16px */
      input,select,textarea{font-size:16px;padding:13px 12px;border-radius:10px}
      /* 触控目标≥44px（Apple HIG） */
      .primary,.secondary,.danger{min-height:48px;font-size:16px}
      .tiny{min-height:40px;padding:9px 14px;font-size:14px}
      .record-actions{gap:7px}
      /* 去掉 iOS 输入框默认内阴影，自绘下拉箭头 */
      input,textarea{-webkit-appearance:none;appearance:none}
      select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
      /* 头部与统计卡片紧凑化 */
      header{margin-bottom:12px}
      .title{font-size:26px}
      .stats{gap:8px;margin-bottom:10px}
      .stat{min-height:88px;padding:10px 12px}
      .stat small{font-size:12px}
      .stat strong{font-size:clamp(16px,4.8vw,22px);margin-top:6px}
      /* 面板与表单收紧 */
      .layout{gap:10px}
      .panel-head{padding:12px 13px}
      .panel-head h2{font-size:16px}
      .panel-body{padding:13px}
      .field{margin-bottom:12px}
      label{font-size:13px;margin-bottom:5px}
      .actions{gap:10px}
      /* 日程卡片 */
      .schedule-list{padding:8px 10px 12px;gap:8px}
      .day-head{padding:10px 12px;gap:8px}
      .day-title{font-size:14px}
      .day-title small{font-size:12px;margin-left:5px}
      .date-badge{font-size:10px;padding:3px 7px}
      .day-total{font-size:13px}
      .day-confirm{min-height:36px}
      .day-item{padding:10px 12px;gap:6px}
      .item-amount{font-size:15px}
      .item-note{font-size:11px}
      /* 历史区工具栏 */
      .toolbar{gap:8px}
      .toolbar .secondary{flex:1;min-height:44px;font-size:14px;padding:10px 8px}
      .toolbar select{width:100%;min-height:44px}
      /* 删除弹窗贴底，单手可达 */
      .modal{padding:0;place-items:end center}
      .dialog{border-radius:18px 18px 0 0;max-width:none;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
      .footnote{font-size:11px;margin:10px 4px}
    }
    /* 按钮区域禁用双击缩放手势 */
    button{touch-action:manipulation}

    /* ===== 全部记录：窄屏紧凑行，点按展开操作按钮（高密度浏览）===== */
    @media(max-width:560px){
      .table-wrap{overflow:visible}
      .records{min-width:0;border-collapse:separate;border-spacing:0 8px}
      .records thead{display:none}
      .records tbody{display:block}
      .records tbody tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"type money status" "sale arrival arrival" "note note note" "acts acts acts";column-gap:10px;align-items:center;background:rgba(17,27,45,.50);border:1px solid var(--line);border-radius:13px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent}
      .records tbody tr.open{border-color:rgba(6,182,212,.55);box-shadow:0 0 0 1px rgba(6,182,212,.25),var(--shadow)}
      .records tbody tr:hover td{background:transparent}
      .records tbody td{display:block;padding:0;border:0;text-align:left}
      .records tbody td::before{font-size:11px;font-weight:800;color:var(--muted)}
      .records td[data-label="交易"]{display:contents}
      .records td[data-label="交易"]::before{content:none}
      .records td[data-label="交易"] .type{grid-area:type}
      .records td[data-label="交易"] .date-note{grid-area:note;margin:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .records td[data-label="交易"] .date-note:empty{display:none}
      .records td.money{grid-area:money;text-align:right;font-size:16px;white-space:nowrap}
      .records td.money::before{content:none}
      .records td[data-label="状态"]{grid-area:status;text-align:right;white-space:nowrap}
      .records td[data-label="状态"]::before{content:none}
      .records td[data-label="交易日"]{grid-area:sale;font-size:12px;color:var(--muted);padding-top:6px;white-space:nowrap}
      .records td[data-label="交易日"]::before{content:'交易 '}
      .records td[data-label="到账日期"]{grid-area:arrival;font-size:12px;padding-top:6px;white-space:nowrap}
      .records td[data-label="到账日期"]::before{content:'到账 ';color:#67e8f9}
      .records td.cell-actions{grid-area:acts;display:none;padding-top:10px}
      .records td.cell-actions::before{content:none}
      .records tbody tr.open td.cell-actions{display:block}
      .records .record-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .records .record-actions .tiny{width:100%;min-height:42px;font-size:14px}
    }

<body class="arrival-page">
<main class="shell">
  <header><div><div class="eyebrow">Cashflow desk</div><h1 class="title">资金到账</h1><p class="sub">记录资金并按日期查看到账安排。</p></div><div class="today" id="today"></div><button class="secondary" id="dataBtn" type="button" style="white-space:nowrap">📦 数据导入/导出</button></header>
  <section class="stats"><div class="stat pending"><small>待到账金额</small><strong id="sPending">$ 0</strong></div><div class="stat"><small>已到账金额</small><strong id="sArrived">$ 0</strong></div><div class="stat"><small>今日预计到账</small><strong id="sToday">$ 0</strong></div><div class="stat"><small>待处理笔数</small><strong id="sCount">0</strong></div></section>
  <section class="layout">
    <details class="panel addbox" id="addBox"><summary><span class="ab-plus">＋</span><span id="formTitle">新增交易</span><span class="ab-hint">点开填写</span></summary><div class="panel-body">
      <form id="entryForm">
        <div class="field"><label for="type">支付类型</label><select id="type" required><option value="debito">Débito</option><option value="credito">Crédito</option><option value="prepaid">Prepaid</option><option value="short">差钱</option></select></div>
        <div class="field"><label for="amount">金额</label><input id="amount" type="text" inputmode="decimal" placeholder="162.794,98" required><div class="hint" id="amountPreview"></div></div>
        <div class="row"><div class="field"><label for="saleDate" id="saleLabel">交易日期</label><input id="saleDate" type="date" required></div><div class="field" id="arrivalField"><label for="arrivalDate" id="arrivalLabel">到账日期</label><input id="arrivalDate" type="date" required></div></div>
        <div class="hint" id="arrivalPreview"></div>
        <div class="field"><label for="note">备注</label><textarea id="note" maxlength="160" placeholder="可选"></textarea></div>
        <div class="actions"><button class="primary" type="submit" id="saveBtn">保存交易</button><button class="secondary" type="button" id="cancelEdit" hidden>取消</button></div>
      </form>
    </div></details>
    <details class="panel schedule shortbox" id="shortBox"><summary><span>每日差钱</span><span class="sh-sum" id="shortSum"></span></summary><div id="cmpBox" class="cmpbox"></div><div class="schedule-list" id="shortList"></div></details>
    <section class="panel schedule"><div class="panel-head"><h2>按日期查看到账</h2><span class="hint">昨天 · 今天 · 明天</span></div><div class="schedule-list" id="scheduleList"></div></section>
  </section>
  <details class="panel history"><summary>全部记录与管理</summary><div class="panel-head"><div class="toolbar"><input id="search" placeholder="搜索类型、金额、日期、状态或备注"><select id="filter"><option value="all" selected>全部状态</option><option value="arrived">已到账</option><option value="pending">待到账</option><option value="overdue">已逾期</option></select><select id="typeFilter" aria-label="按支付类型筛选"><option value="all" selected>全部类型</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="prepaid">Prepaid</option><option value="short">差钱</option></select><select id="sortBy" aria-label="排序方式"><option value="arrival-asc" selected>到账日 · 早→晚</option><option value="arrival-desc">到账日 · 晚→早</option><option value="sale-desc">交易日 · 新→旧</option><option value="sale-asc">交易日 · 旧→新</option></select></div></div>
      <div class="table-wrap"><table class="records"><thead><tr><th>交易</th><th>金额</th><th>交易日</th><th>到账日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty"><b>还没有交易</b>从左侧添加第一笔待到账资金。</div></div>
  </details><p class="footnote">数据仅保存在当前浏览器，金额按币种分别显示。</p>
</main>
<div class="modal" id="dataModal" style="background:rgba(2,6,23,.82) !important"><div class="dialog" style="background:#1b2438 !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;max-height:86vh;overflow:auto"><h3 style="margin:0 0 4px">数据导入 / 导出</h3><p id="dataInfo" style="margin:0 0 14px"></p>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span id="watchDot" style="width:9px;height:9px;border-radius:50%;background:#64748b;flex:none"></span><b style="font-size:15px">自动导入</b><span id="watchBadge" style="margin-left:auto;font-size:12px;color:var(--muted)">未启用</span></div>

<p id="watchLast" class="dm-last" hidden></p>
</div></div>

<div class="modal" id="confirmModal"><div class="dialog cf-dialog"><div class="cf-icon">🗑</div><h3>删除这笔记录?</h3><div class="cf-sum" id="cfSum"></div><p class="cf-tip">删除后无法恢复。</p><div class="cf-btns"><button class="cf-del" id="confirmDelete" type="button">删除</button><button class="cf-cancel" id="closeModal" type="button">取消</button></div></div></div>
<script>
(() => {
  const KEY='fund-arrival-manager-v1';
  let items=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}})(), editing=null, deleting=null, draftCurrency='ARS';
  const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
  const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+Number(n));return localISO(d)};
  const displayDate=iso=>new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',year:'numeric'}).format(new Date(iso+'T12:00:00'));
  const money=(n,c)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:2}).format(n);
  const totalsText=map=>Object.entries(map).map(([c,n])=>money(n,c)).join(' · ')||'$ 0';
  const tl=t=>t==='short'?'差钱':t,isShort=x=>x.type==='short',dd=iso=>iso?displayDate(iso):'待定';
  const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
  function typeUI(){const sh=$('type').value==='short',hide=false;$('arrivalField').hidden=hide;$('arrivalDate').required=!sh;$('saleLabel').textContent=sh?'差钱日期':'交易日期';$('arrivalLabel').textContent=sh?'补上日期(可选,不确定可留空)':'到账日期';if(hide)$('arrivalDate').value='';else if(!sh&&!$('arrivalDate').value)$('arrivalDate').value=$('saleDate').value||localISO()}
  function preview(){const sale=$('saleDate').value,arrival=$('arrivalDate').value;$('arrivalDate').min=sale||'';$('arrivalDate').setCustomValidity(arrival&&sale&&arrival<sale?'到账日期不能早于交易日期':'');$('arrivalPreview').textContent=arrival?`将在 ${displayDate(arrival)} ${$('type').value==='short'?'补上':'到账'}`:''}
  // 解析金额：同时支持阿根廷格式（162.794,98 = 点千分位、逗号小数）与英文格式（162,794.98 / 162794.98）
  function parseAmount(raw){
    if(raw==null)return NaN;
    let s=String(raw).trim().replace(/\s+/g,'').replace(/\$/g,'');
    if(!s)return NaN;
    if(!/^[\d.,]+$/.test(s))return NaN;
    const lastDot=s.lastIndexOf('.'),lastComma=s.lastIndexOf(',');
    if(lastDot>-1&&lastComma>-1){
      // 两种分隔符都有：靠后的是小数点
      if(lastComma>lastDot)s=s.replace(/\./g,'').replace(',','.');
      else s=s.replace(/,/g,'');
    }else if(lastComma>-1){
      // 只有逗号：阿根廷格式，逗号是小数点
      s=s.replace(/\./g,'').replace(',','.');
    }else if(lastDot>-1){
      const parts=s.split('.');
      // 多个点，或单个点后跟3位以上数字 → 视为千分位
      if(parts.length>2||parts[1].length>2)s=s.replace(/\./g,'');
    }
    const n=Number(s);
    return Number.isFinite(n)?Math.round(n*100)/100:NaN;
  }
  function fmtAmountInput(n){return Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2})}
  function amountPreview(){
    const el=$('amount'),n=parseAmount(el.value);
    el.setCustomValidity(!el.value.trim()||(!Number.isFinite(n)||n<=0)?'请输入有效金额，如 162.794,98':'');
    $('amountPreview').textContent=Number.isFinite(n)&&n>0?`= ${money(n,draftCurrency)}`:'';
  }
  function resetForm(){editing=null;draftCurrency='ARS';$('entryForm').reset();$('amount').setCustomValidity('');$('amountPreview').textContent='';$('saleDate').value=localISO();$('arrivalDate').value=localISO();$('formTitle').textContent='新增交易';$('saveBtn').textContent='保存交易';$('cancelEdit').hidden=true;$('addBox').open=false;typeUI();preview()}
  function statusOf(x){if(x.arrived)return'arrived';return x.arrivalDate&&x.arrivalDate<localISO()?'overdue':'pending'}
  function dayLabel(iso){const today=localISO(),yesterday=addDays(today,-1),tomorrow=addDays(today,1);if(iso===yesterday)return'昨天';if(iso===today)return'今天';if(iso===tomorrow)return'明天';return new Intl.DateTimeFormat('zh-CN',{weekday:'short'}).format(new Date(iso+'T12:00:00'))}
  function renderSchedule(){
    const today=localISO(),dates=[addDays(today,-1),today,addDays(today,1)];
    $('scheduleList').innerHTML=dates.map(date=>{const list=items.filter(x=>!x.arrived&&x.type!=='short'&&x.arrivalDate===date),totals=list.reduce((m,x)=>(m[x.currency||'ARS']=(m[x.currency||'ARS']||0)+Number(x.amount),m),{}),badge=date<today?'overdue':date===today?'today':'',overdue=date<today?' overdue-group':'',content=list.length?list.map(x=>`<div class="day-item"><div class="item-main"><span class="type ${x.type}">${tl(x.type)}</span><span class="item-note">${esc(x.note||'')}</span></div><div class="item-amount">${money(x.amount,x.currency||'ARS')}</div><button class="tiny" data-schedule-toggle="${x.id}">确认到账</button></div>`).join(''):'<div class="schedule-empty">暂无待到账</div>';if(!list.length)return `<section class="day-group" style="background:transparent"><div class="day-head" style="padding:9px 14px;background:transparent"><div class="day-title" style="font-size:14px;font-weight:700">${displayDate(date)} <span class="date-badge ${badge}">${dayLabel(date)}</span></div><div class="day-head-right"><span style="color:var(--muted);font-size:13px">暂无待到账</span></div></div></section>`;
return `<section class="day-group${overdue}"><div class="day-head"><div class="day-title">${displayDate(date)} <span class="date-badge ${badge}">${dayLabel(date)}</span><small>${list.length} 笔</small></div><div class="day-head-right"><div class="day-total">${totalsText(totals)}</div>${list.length?`<button class="tiny day-confirm" data-day-confirm="${date}">当天全部到账</button>`:''}</div></div><div class="day-items">${content}</div></section>`}).join('')
  }
  /* ===== 白色机器(来自财务系统)与未扣税合计对比 ===== */
  const WHITE_KEY='arrival-white-v1',CMP_KEY='arrival-compare-v1',SHORT_MIN=3000,MATCH_TOL=3000;
  const r2=n=>Math.round(n*100)/100;
  const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v==null)return d;if(k==='arrival-compare-v1'&&Array.isArray(v))v.forEach(c=>{const df=Math.round((c.tot-c.white)*100)/100;c.diff=df;c.st=df>0?'more':df===0?'even':'short'});return v}catch(e){return d}};
  /* 白色机器由财务系统在有数值时主动写入 WHITE_KEY(覆盖规则在财务端);这里只读取 */
  async function syncWhite(){return jget(WHITE_KEY,null)}
  function compareWhite(white,tot,date,fileName){
    const diff=r2(tot-white),st=diff>0?'more':diff===0?'even':'short';
    let list=jget(CMP_KEY,[]).filter(x=>x.date!==date);list.push({date,white,tot,diff,st,file:fileName||''});list.sort((a,b)=>a.date.localeCompare(b.date));try{localStorage.setItem(CMP_KEY,JSON.stringify(list.slice(-15)))}catch(e){}
    let added=false,changed=false;
    if(st==='short'&&-diff>SHORT_MIN){
      const ref='short-'+date,amt=-diff,note=`未扣税 ${fmtAmountInput(tot)} − 白色机器 ${fmtAmountInput(white)}`,ex=items.find(x=>x.type==='short'&&x.reference===ref);
      if(!ex){items.push({id:crypto.randomUUID(),type:'short',amount:amt,currency:'ARS',saleDate:date,arrivalDate:'',reference:ref,note,white,arrived:false});added=true}
      else if(!ex.arrived&&(ex.amount!==amt||ex.white!==white)){ex.amount=amt;ex.note=note;ex.white=white;changed=true}
    }
    /* 多钱时:与未补上的差钱逐笔比对,对得上就标记已补上,补上日期取这一批数据的交易日期 */
    const filled=[];
    if(st==='more'){
      let left=diff;
      items.filter(x=>x.type==='short'&&!x.arrived).sort((a,b)=>String(a.saleDate).localeCompare(String(b.saleDate))).forEach(x=>{
        const amt=Math.abs(Number(x.amount)||0);
        if(left<=0||amt<=0)return;
        if(left+MATCH_TOL>=amt){
          x.arrived=true;x.arrivalDate=date;x.filledBy={date,diff,at:Date.now()};
          left=r2(left-amt);filled.push(x);
        }
      });
    }
    return{diff,st,added,changed,filled};
  }
  /* 对比行必须有对应的(未补上的)差钱记录,没有就删除,存储里也不留 */
  function pruneCompare(){
    const list=jget(CMP_KEY,[]);if(!list.length)return;
    const keep=list.filter(c=>items.some(x=>x.type==='short'&&x.reference==='short-'+c.date&&!x.arrived));
    if(keep.length!==list.length)try{localStorage.setItem(CMP_KEY,JSON.stringify(keep))}catch(e){}
  }
  const CMP_TXT={more:['多钱','sh-ok'],even:['平账','sh-ok'],short:['差钱','sh-red']};
  function renderCompare(){
    pruneCompare();
    const w=jget(WHITE_KEY,null),list=jget(CMP_KEY,[]).slice().reverse().slice(0,4);
    const head=`<div class="wm-card"><div><div class="wm-l">白色机器</div><div class="wm-v">${w?money(w.value,'ARS'):'暂无'}</div></div><div class="wm-t">${w?'财务系统<br>'+w.at:'等待财务系统录入'}</div></div>`;
    const rows=list.length?list.map(c=>{const t=CMP_TXT[c.st],skip=c.st==='short'&&-c.diff<=SHORT_MIN;return `<div class="cmp-row"><div class="cmp-l"><b>${c.date.slice(5).replace('-','/')}</b><span>未扣税 ${money(c.tot,'ARS')}</span></div><div class="cmp-r ${t[1]}"><b>${c.st==='short'?'−':c.st==='more'?'+':''}${money(Math.abs(c.diff),'ARS')}</b><span>${t[0]}${skip?' · 不计入':''}</span></div></div>`}).join(''):'<div class="cmp-empty">导入含「未扣税合计」的文件后,这里显示每日对比</div>';
    $('cmpBox').innerHTML=head;
  }
  const shortOpen=new Set();
  function renderShort(){
    if(typeof renderCompare==='function')renderCompare();
    const md=iso=>{const t=iso.split('-');return Number(t[1])+'/'+Number(t[2])},list=items.filter(isShort).sort((a,b)=>b.saleDate.localeCompare(a.saleDate)||String(a.id).localeCompare(String(b.id)));
    const open=list.filter(x=>!x.arrived),done=list.filter(x=>x.arrived),tot={};open.forEach(x=>{const c=x.currency||'ARS';tot[c]=(tot[c]||0)+Number(x.amount)});
    $('shortSum').innerHTML=open.length?`<b class="sh-red">${open.length} 笔未补</b> · ${totalsText(tot)}`:(list.length?'<span class="sh-ok">全部已补上</span>':'暂无');

      localStorage.setItem(WKEY,r.sig);
      if(!fresh.length&&!manual&&!cmpAlert)return;
      if(fresh.length){const t=new Date();localStorage.setItem('arrival-watch-info',JSON.stringify({at:`${pad(t.getMonth()+1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`,name:r.name,added:fresh.length}));watchLastPaint(true)}
      const tot=fresh.reduce((m,x)=>(m[x.currency]=(m[x.currency]||0)+x.amount,m),{});
      alert(`📥 已自动导入\n文件:${r.name}\n新增 ${fresh.length} 笔`+(fresh.length?`(合计 ${totalsText(tot)})`:'')+`\n重复忽略 ${keep.length-fresh.length} 笔`+(expired?`\n超过 ${PURGE_DAYS} 天的已到账记录忽略 ${expired} 笔`:'')+(bad?`\n无效 ${bad} 笔(已忽略)`:'')+`\n现共 ${items.length} 笔记录。`+cmpMsg);
    }finally{watchBusy=false}
  }
  renderCompare();window.addEventListener('storage',e=>{if(e.key===WHITE_KEY)renderCompare()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderCompare()});
  if(watchOK){
    NBr.call('watchInfo').then(i=>watchPaint(i&&i.name));
    $('watchLocalBtn').onclick=async()=>{const r=await NBr.call('watchLocal');if(r.ok){watchPaint(r.name);localStorage.removeItem(WKEY);alert('已启用。\n把导出文件放进「文件」App → 我的 iPhone → Caja → 资金到账导入 即可。')}};
    $('watchNowBtn').onclick=()=>{dm.classList.remove('open');watchScan(true)};
    $('watchOffBtn').onclick=async()=>{await NBr.call('watchClear');localStorage.removeItem(WKEY);watchPaint('')};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>watchScan(false),300)});
    setTimeout(()=>watchScan(false),300);
  }

})();
</script>
